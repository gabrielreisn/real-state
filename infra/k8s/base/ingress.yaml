# The API is deliberately not routed: the web app calls it inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: real-state
spec:
  ingressClassName: nginx
  rules:
    - host: real-state.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 3000 } }
    - host: cms.real-state.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: studio, port: { number: 8080 } }
