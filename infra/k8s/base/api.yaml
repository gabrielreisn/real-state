apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Keep at 1 for now: each pod runs migrations in its init container, and TypeORM does not
  # guard against two pods migrating at once. Move migrations to a Job before scaling up.
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: migrate
          image: real-state/api
          command: [node, dist/migrate.js]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: real-state-secrets, key: DATABASE_URL }
      containers:
        - name: api
          image: real-state/api
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: real-state-secrets, key: DATABASE_URL }
          livenessProbe:
            httpGet: { path: /health/live, port: 4000 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 4000 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
